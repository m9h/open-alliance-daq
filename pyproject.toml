[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-alliance-daq"
version = "0.1.0"
description = "Open-source analog data acquisition and peak integration for a Waters Alliance e2695 HPLC stack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Morgan Hough" }]
dependencies = []   # acquisition needs only the standard library; see extras

[project.optional-dependencies]
pi = ["spidev", "gpiod>=2.1"]          # acquisition box: hardware bindings only
analysis = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "hplc-py>=0.2", "matplotlib", "jinja2>=3"]
dev = ["pytest", "numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "hplc-py>=0.2", "matplotlib", "jinja2>=3"]

[project.scripts]
alliance-daq = "alliance_daq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["alliance_daq"]
include = ["alliance_daq/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
