<text x="60" y="740" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#757575">All instrument pin numbers were read from the rear-panel legends in docs/photos/. Verify each against the physical label before wiring; power everything down first.</text>
<text x="60" y="758" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#757575">Only ONE instrument ground (2489 block I pin 3) goes to AGND. The differential inputs need it for common-mode reference; a second ground makes a loop.</text>
