name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: wtfjoke/setup-tectonic@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run alliance-daq record --simulate --trigger now --duration 200 --rate 20 --out /tmp/runs --label ci
      - run: uv run alliance-daq peaks /tmp/runs/*_ci.csv
      - run: uv run alliance-daq quant /tmp/runs/*_ci.csv --plot /tmp/fit.png
      - run: uv run alliance-daq report /tmp/runs/*_ci.csv --column uv1 --column els --out /tmp/report/ci.pdf
      - uses: actions/upload-artifact@v4
        with: { name: ci-report, path: /tmp/report/ci.pdf }
